[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "piiparity"
version = "0.2.0"
description = "Multilingual PII detection and redaction research baseline"
requires-python = ">=3.10"
dependencies = []
[project.scripts]
piiparity = "piiparity.__main__:main"
piiparity-ui = "piiparity.app:main"
[tool.setuptools.packages.find]
where = ["src"]
